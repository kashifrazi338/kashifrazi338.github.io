name: second-view-tiles
on:
  workflow_dispatch:
  push:
    branches: [gba-obstacles]
    paths: ['tools/second_view/**', '.github/workflows/second-view.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install rasterio pillow numpy
      - working-directory: tools/second_view
        run: python fetch.py points.csv 2>&1 | tail -5
      - name: Commit
        run: |
          mkdir -p results_second_view && cd tools/second_view/out && zip -q -r ../../../results_second_view/world_imagery_tiles.zip . && cd -
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_second_view && git commit -m "World Imagery test tiles ${{ github.run_id }} [skip ci]" && (git push || (git pull --rebase && git push))
