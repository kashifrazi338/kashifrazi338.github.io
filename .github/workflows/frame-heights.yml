name: Building heights in a small box

on:
  push:
    branches: [gba-obstacles]
    paths: ["tools/frame_heights/**", ".github/workflows/frame-heights.yml"]
  workflow_dispatch:
    inputs:
      bbox: {description: "W S E N (degrees); empty = boxes in jobs.txt", default: ""}
      pbf_url: {description: "Geofabrik extract URL for a manual box", default: "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf"}
      floor_m: {description: "Metres per floor for floor-count estimates", default: "3.5"}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install requests shapely pyshp duckdb huggingface_hub ijson
      - name: Heights for every building in each box
        working-directory: tools/frame_heights
        run: |
          set -o pipefail
          mkdir -p frame_out
          if [ -n "${{ github.event.inputs.bbox }}" ]; then
            echo "manual ${{ github.event.inputs.pbf_url || 'https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf' }} ${{ github.event.inputs.bbox }}" > run_jobs.txt
          else
            grep -v '^#' jobs.txt | grep -v '^\s*$' > run_jobs.txt
          fi
          while read -r name url w s e n; do
            f=$(basename "$url")
            [ -f "$f" ] || curl -sSfL -o "$f" "$url"
            echo "=== $name ($w $s $e $n) ==="
            python frame_heights.py --bbox $w $s $e $n --pbf "$f" --floor-m "${{ github.event.inputs.floor_m || '3.5' }}" \
              --out "frame_out/$name" 2>&1 | tee "frame_out/${name}_log.txt"
            rm -rf osm_work
          done < run_jobs.txt
      - name: Commit results (results_frame/)
        if: always()
        run: |
          rm -rf results_frame && mkdir -p results_frame
          cp -r tools/frame_heights/frame_out/. results_frame/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_frame
          git commit -m "Frame building heights from run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git push || (git pull --rebase && git push)
