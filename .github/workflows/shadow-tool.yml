name: build-shadow-height-tool
on:
  workflow_dispatch:
  push:
    branches: [gba-obstacles]
    paths: ['tools/shadow_height_batch/**', '.github/workflows/shadow-tool.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard "numpy==2.2.6" rasterio opencv-python-headless pyshp pillow
      - name: Test source
        shell: bash
        run: |
          cp tools/shadow_height_batch/mosques_ksa.csv.gz tools/shadow_height_batch/shadow_model.npz tools/shadow_height_batch/shadow_training_data.npz .
          python tools/shadow_height_batch/shadow_height_batch.py --selftest src_test
          SHB_GUI_SMOKE=gui_src.txt python tools/shadow_height_batch/shadow_height_batch.py && cat gui_src.txt
      - name: Compile (native code, no Python source inside)
        run: >
          python -m nuitka --standalone --onefile --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --include-package=rasterio --include-package-data=rasterio --include-module=numpy._core._exceptions
          --include-data-files=tools/shadow_height_batch/mosques_ksa.csv.gz=mosques_ksa.csv.gz
          --include-data-files=tools/shadow_height_batch/shadow_model.npz=shadow_model.npz
          --include-data-files=tools/shadow_height_batch/shadow_training_data.npz=shadow_training_data.npz
          --nofollow-import-to=pytest --nofollow-import-to=IPython --nofollow-import-to=matplotlib
          --windows-console-mode=attach
          --company-name="Shadow Height" --product-name="Shadow Height Batch" --file-version=3.3.0.0 --product-version=3.3.0.0
          --output-filename=ShadowHeightBatch.exe --output-dir=build
          tools/shadow_height_batch/shadow_height_batch.py
      - name: Test exe
        shell: bash
        run: |
          ./build/ShadowHeightBatch.exe --selftest exe_test 2>&1 | tee exe_test.log
          grep -q "SELFTEST PASSED" exe_test.log
          ./build/ShadowHeightBatch.exe --test-second https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer 2>&1 | tee -a exe_test.log
          grep -q "second image window: OK" exe_test.log
          printf 'name,lat,lon\nNW,24.7262,46.8425\nSE,24.7235,46.8455\n' > svc_area.csv
          ./build/ShadowHeightBatch.exe --mosques-auto --image "https://www.arcgis.com/apps/mapviewer/index.html?url=https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer&source=sd" --area svc_area.csv --out svc_out 2>&1 | tee -a exe_test.log
          ls svc_out/minaret_scan_heights.csv
          SHB_GUI_SMOKE=gui_exe.txt ./build/ShadowHeightBatch.exe; sleep 3; cat gui_exe.txt | tee -a exe_test.log
      - name: Package and commit
        shell: bash
        run: |
          mkdir -p results_tool pkg
          cp build/ShadowHeightBatch.exe tools/shadow_height_batch/README.txt tools/shadow_height_batch/points_template.csv pkg/
          (cd pkg && 7z a -tzip ../results_tool/ShadowHeightBatch_v3_3.zip *)
          cp exe_test.log results_tool/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results_tool
          git commit -m "Shadow height batch tool build ${{ github.run_id }} [skip ci]"
          git pull --rebase origin gba-obstacles && git push origin HEAD:gba-obstacles
